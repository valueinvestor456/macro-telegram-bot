name: Scheduled Macro Summary Send

on:
  schedule:
    # Times in UTC (Bangkok is UTC+7)
    - cron: '45 02 * * *'   # 09:45 Bangkok
    - cron: '00 03 * * *'   # 10:00 Bangkok
    - cron: '00 04 * * *'   # 11:00 Bangkok
    - cron: '00 05 * * *'   # 12:00 Bangkok
    - cron: '00 07 * * *'   # 14:00 Bangkok
    - cron: '30 07 * * *'   # 14:30 Bangkok
    - cron: '00 08 * * *'   # 15:00 Bangkok
    - cron: '00 09 * * *'   # 16:00 Bangkok
    - cron: '15 09 * * *'   # 16:15 Bangkok
    - cron: '30 12 * * *'   # 19:30 Bangkok
    - cron: '30 13 * * *'   # 20:30 Bangkok
    - cron: '00 14 * * *'   # 21:00 Bangkok
    # Recovery wakeups. The ledger selects due slots and prevents duplicates.
    - cron: '7,22,37,52 2-14 * * 1-5'
    - cron: '40 14 * * 1-5' # Check final-round coverage after 21:30 Bangkok

  # Allow manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      preview:
        description: Inspect due work without sending or changing delivery state
        type: boolean
        default: true

concurrency:
  group: macro-summary-delivery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send-macro-summary:
    if: ${{ vars.MACRO_SCHEDULER_ENABLED != 'false' || inputs.preview }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: pip
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Send Macro Summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.preview }}
        run: |
          if [ "$PREVIEW" = "true" ]; then
            python macro_scheduler.py --store github --preview
          else
            python macro_scheduler.py --store github
          fi
