name: Scheduled Macro Summary Send

on:
  schedule:
    # UTC = Bangkok minus 7 hours. Bank holidays are checked by the sender.
    # 35 slots per bank trading day: 08:00-16:30 and 19:00-03:00 next day.
    # UTC hours 17-20 belong to the NEXT Thai calendar day, same trading day.
    - cron: '0,30 1-9 * * 1-5'   # 08:00-16:30 Bangkok
    - cron: '0,30 12-19 * * 1-5' # 19:00-02:30 Bangkok
    - cron: '0 20 * * 1-5'      # 03:00 Bangkok next day (Saturday for Friday)
    # Recovery wakeups. The ledger selects due slots and prevents duplicates.
    - cron: '7,22,37,52 1-9,12-20 * * 1-5'
    - cron: '40 20 * * 1-5' # Audit after 03:30 next day

  # Allow manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      preview:
        description: Inspect due work without sending or changing delivery state
        type: boolean
        default: true

concurrency:
  group: macro-summary-delivery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send-macro-summary:
    if: ${{ vars.MACRO_SCHEDULER_ENABLED != 'false' || inputs.preview }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: pip
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Send Macro Summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.preview }}
        run: |
          if [ "$PREVIEW" = "true" ]; then
            python macro_scheduler.py --store github --preview
          else
            python macro_scheduler.py --store github
          fi
