name: Macro Bot - Send Messages

on:
  schedule:
    # Send at 09:45, 10:00, 11:00, 14:00, 15:00, 16:00, 16:15, 19:30, 20:30 Bangkok time
    # Bangkok is UTC+7, so convert to UTC by subtracting 7 hours
    - cron: '45 02 * * *'  # 09:45 Bangkok = 02:45 UTC
    - cron: '00 03 * * *'  # 10:00 Bangkok = 03:00 UTC
    - cron: '00 04 * * *'  # 11:00 Bangkok = 04:00 UTC
    - cron: '00 07 * * *'  # 14:00 Bangkok = 07:00 UTC
    - cron: '00 08 * * *'  # 15:00 Bangkok = 08:00 UTC
    - cron: '00 09 * * *'  # 16:00 Bangkok = 09:00 UTC
    - cron: '15 09 * * *'  # 16:15 Bangkok = 09:15 UTC
    - cron: '30 12 * * *'  # 19:30 Bangkok = 12:30 UTC
    - cron: '30 13 * * *'  # 20:30 Bangkok = 13:30 UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  send-macro-summary:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests schedule yfinance beautifulsoup4
    
    - name: Run Macro Bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py --once
